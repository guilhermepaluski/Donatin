name: Build and deploy Donatin to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/main_donatin.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: donatin
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: https://donatin-api-ehdvhbd5gzh8eza5.brazilsouth-01.azurewebsites.net/api

      - name: Verify build output
        run: |
          test -f web/dist/index.html
          echo "Build concluído. index.html encontrado."

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r web/dist deploy/dist
          cp web/package.json deploy/package.json
          cp web/package-lock.json deploy/package-lock.json

      - name: Install production dependencies
        working-directory: deploy
        run: npm ci --omit=dev --ignore-scripts

      - name: Upload deployment package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: donatin-app
          path: deploy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: donatin-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D4FAA1AA916494D8813A292EC4E112A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC1CAB399792436295D56B9443BE0F8D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA7CBFE77DE84B4E8D3B469E1F988395 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: deploy
          clean: true
          restart: true

      - name: Logout from Azure
        if: always()
        run: az logout
