name: Build and deploy Donatin to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: donatin
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify build output
        run: |
          test -f web/dist/index.html
          echo "Build concluído. index.html encontrado."

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r web/dist deploy/dist
          cp web/package.json deploy/package.json
          cp web/package-lock.json deploy/package-lock.json

      - name: Install production dependencies
        working-directory: deploy
        run: npm ci --omit=dev

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: donatin-app
          path: deploy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: donatin-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1D4FAA1AA916494D8813A292EC4E112A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC1CAB399792436295D56B9443BE0F8D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA7CBFE77DE84B4E8D3B469E1F988395 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: deploy
          clean: true
          restart: true

      - name: Logout from Azure
        if: always()
        run: az logout
